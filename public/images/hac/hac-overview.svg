<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" width="1440" height="780" role="img" aria-labelledby="title desc">
  <title id="title">HAC 整体工作关系</title>
  <desc id="desc">展示活字格设计器、交互命令插件、活字格 Web 应用、HAC、WebView、Android 系统和 PDA 硬件之间的开发发布与运行时关系。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #1e293b; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { fill: #64748b; font-size: 15px; }
    .lane { fill: #64748b; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .node-title { font-size: 18px; font-weight: 700; }
    .node-subtitle { fill: #64748b; font-size: 14px; }
    .detail { fill: #475569; font-size: 13px; }
    .label { fill: #475569; font-size: 12px; }
    .dark-title { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .note { fill: #475569; font-size: 13px; }
    .legend { fill: #64748b; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1440" height="780" fill="#ffffff"/>
  <text x="64" y="52" class="title">HAC 整体工作关系</text>
  <text x="64" y="80" class="subtitle">HAC 通过 WebView 加载活字格 Web 应用，并将页面请求桥接到 Android 与 PDA 硬件能力</text>

  <rect x="48" y="110" width="1344" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="72" y="138" class="lane">开发与发布</text>

  <rect x="72" y="158" width="270" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="88" y="176" width="34" height="28" rx="5" fill="#e2e8f0"/>
  <text x="105" y="195" text-anchor="middle" fill="#475569" font-size="12" font-weight="700">01</text>
  <text x="138" y="185" class="node-title">活字格设计器</text>
  <text x="138" y="208" class="node-subtitle">设计页面，安装所需插件</text>

  <rect x="390" y="158" width="270" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="406" y="176" width="34" height="28" rx="5" fill="#e2e8f0"/>
  <text x="423" y="195" text-anchor="middle" fill="#475569" font-size="12" font-weight="700">02</text>
  <text x="456" y="185" class="node-title">交互命令插件</text>
  <text x="456" y="208" class="node-subtitle">提供 PDA / Android 交互命令</text>

  <rect x="708" y="158" width="270" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="724" y="176" width="34" height="28" rx="5" fill="#e2e8f0"/>
  <text x="741" y="195" text-anchor="middle" fill="#475569" font-size="12" font-weight="700">03</text>
  <text x="774" y="185" class="node-title">活字格 Web 应用</text>
  <text x="774" y="208" class="node-subtitle">发布页面与业务接口</text>

  <rect x="1026" y="158" width="270" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1042" y="176" width="34" height="28" rx="5" fill="#e2e8f0"/>
  <text x="1059" y="195" text-anchor="middle" fill="#475569" font-size="12" font-weight="700">04</text>
  <text x="1092" y="185" class="node-title">应用配置</text>
  <text x="1092" y="208" class="node-subtitle">地址、权限与设备参数</text>

  <path d="M 342 196 H 390" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="348" y="178" width="36" height="20" rx="4" fill="#f8fafc"/>
  <text x="366" y="192" text-anchor="middle" class="label">安装</text>
  <path d="M 660 196 H 708" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="666" y="178" width="36" height="20" rx="4" fill="#f8fafc"/>
  <text x="684" y="192" text-anchor="middle" class="label">发布</text>
  <path d="M 978 196 H 1026" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="984" y="178" width="36" height="20" rx="4" fill="#f8fafc"/>
  <text x="1002" y="192" text-anchor="middle" class="label">配置</text>

  <rect x="48" y="286" width="1344" height="414" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="72" y="314" class="lane">运行时</text>

  <rect x="72" y="370" width="310" height="206" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="411" class="node-title">活字格 Web 应用</text>
  <text x="100" y="438" class="node-subtitle">服务器提供页面与业务接口</text>
  <line x1="100" y1="460" x2="354" y2="460" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="490" class="detail">页面展示 · 表单录入 · 业务校验</text>
  <text x="100" y="518" class="detail">提交数据 · 查询服务端状态</text>
  <text x="100" y="546" class="detail">应用地址由 HAC 配置加载</text>

  <rect x="450" y="334" width="500" height="274" rx="10" fill="#f8fbff" stroke="#60a5fa" stroke-width="2"/>
  <text x="480" y="370" class="node-title">HAC（Huozige Android Container）</text>
  <text x="480" y="395" class="node-subtitle">运行 Android 8.0 及以上版本的容器应用</text>

  <rect x="480" y="424" width="208" height="144" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="480" y="424" width="208" height="24" rx="7" fill="#334155"/>
  <rect x="480" y="440" width="208" height="8" fill="#334155"/>
  <circle cx="496" cy="436" r="3" fill="#f87171"/>
  <circle cx="507" cy="436" r="3" fill="#fbbf24"/>
  <circle cx="518" cy="436" r="3" fill="#4ade80"/>
  <text x="584" y="441" text-anchor="middle" class="dark-title">WebView</text>
  <text x="584" y="480" text-anchor="middle" class="node-title" font-size="16">活字格业务页面</text>
  <text x="584" y="508" text-anchor="middle" class="detail">调用插件命令</text>
  <text x="584" y="532" text-anchor="middle" class="detail">接收结果，更新界面</text>
  <text x="584" y="556" text-anchor="middle" class="detail">保存业务数据</text>

  <rect x="712" y="424" width="208" height="144" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="712" y="424" width="208" height="24" rx="7" fill="#475569"/>
  <rect x="712" y="440" width="208" height="8" fill="#475569"/>
  <text x="816" y="441" text-anchor="middle" class="dark-title">设备能力桥接</text>
  <text x="738" y="481" class="detail">接收页面命令</text>
  <text x="738" y="508" class="detail">检查权限与配置</text>
  <text x="738" y="535" class="detail">调用系统与设备</text>
  <text x="738" y="562" class="detail">返回结果或错误</text>

  <rect x="1028" y="334" width="336" height="274" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1058" y="370" class="node-title">Android 设备</text>
  <text x="1058" y="395" class="node-subtitle">Android 8.0+ 手机、平板或工业 PDA</text>
  <rect x="1058" y="424" width="140" height="144" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1078" y="463" class="node-title" font-size="16">Android 系统</text>
  <text x="1078" y="495" class="detail">权限管理</text>
  <text x="1078" y="520" class="detail">系统服务</text>
  <text x="1078" y="545" class="detail">WebView 运行环境</text>
  <rect x="1218" y="424" width="122" height="144" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1238" y="463" class="node-title" font-size="16">PDA 硬件</text>
  <text x="1238" y="495" class="detail">扫码头</text>
  <text x="1238" y="520" class="detail">相机 / 定位</text>
  <text x="1238" y="545" class="detail">NFC / BLE</text>

  <path d="M 382 474 H 450" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="390" y="455" width="52" height="20" rx="4" fill="#ffffff"/>
  <text x="416" y="469" text-anchor="middle" class="label">加载页面</text>
  <path d="M 950 474 H 1028" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="956" y="455" width="66" height="20" rx="4" fill="#ffffff"/>
  <text x="989" y="469" text-anchor="middle" class="label">调用能力</text>
  <path d="M 688 496 H 712" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="686" y="474" width="28" height="20" rx="4" fill="#f8fbff"/>
  <text x="700" y="488" text-anchor="middle" class="label">命令</text>
  <path d="M 1028 532 H 950" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <rect x="956" y="540" width="66" height="20" rx="4" fill="#ffffff"/>
  <text x="989" y="554" text-anchor="middle" class="label">结果返回</text>
  <path d="M 712 550 H 688" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <rect x="686" y="558" width="28" height="20" rx="4" fill="#f8fbff"/>
  <text x="700" y="572" text-anchor="middle" class="label">结果</text>
  <path d="M 450 570 H 382" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <rect x="390" y="580" width="52" height="20" rx="4" fill="#ffffff"/>
  <text x="416" y="594" text-anchor="middle" class="label">业务请求</text>

  <rect x="72" y="644" width="1292" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="92" y="666" class="note"><tspan font-weight="700">兼容性边界：</tspan>插件、权限、WebView、Android 版本、设备型号和厂商配置需要作为一个整体验证。</text>

  <g transform="translate(72, 744)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="38" y="4" class="legend">页面加载 / 设备调用</text>
    <line x1="190" y1="0" x2="218" y2="0" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="228" y="4" class="legend">插件命令 / 配置</text>
    <line x1="390" y1="0" x2="418" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="428" y="4" class="legend">结果 / 业务数据</text>
  </g>
</svg>
