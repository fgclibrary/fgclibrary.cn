name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须先安装 pnpm：setup-node 开启 cache: pnpm 时会调用
      # `pnpm store path` 计算缓存键，pnpm 尚未就绪会导致该步骤失败。
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: pnpm run check

      - name: Check types
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
